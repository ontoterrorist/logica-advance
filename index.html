  --panel: #fff4d6; --panel-lo: #e8cf9a;
  --ink: #2a1f4d; --ink2: #66598a; --line: #1d1438;

  --w0: #45cfe6; --w1: #5cc83c; --w2: #1fb89a; --w3: #4d95ff; --w4: #ad6cf5; --w5: #ff9a2e; --w6: #f2557a;
  --on-w: #1d1438; --wc: var(--w1);
  --ol: 0 -4px 0 0 var(--line), 0 4px 0 0 var(--line), -4px 0 0 0 var(--line), 4px 0 0 0 var(--line);
  --fd: 'Press Start 2P', 'Courier New', monospace;

}

  --bgw4: #40287a; --bgw4b: #37226a; --bgw5: #7a4418; --bgw5b: #6a3a14; --bgw6: #4d1a34; --bgw6b: #42162c;
  --panel: #27306e; --panel-lo: #1c2354;

  --hi-lo: #b98400; --star: #ffcf2e;
  --ok: #62e088; --bad: #ff8b80; --warn: #ffc85e; --ext: #86aaff;
  color-scheme: dark;
  }
}

  --desk: #07060f; --shell: #2b2866; --shell-hi: #3c3888; --shell-lo: #191742; --shell-ink: #c9c4f5; --bezel: #05050d;
  --key: #17152f; --key-lo: #08071a; --key-ink: #9d97dc;
  --bg: #1b2552; --bg2: #182048;
  --bgw0: #175d6e; --bgw0b: #14505f; --bgw1: #1c5c34; --bgw1b: #184f2c; --bgw2: #124d44; --bgw2b: #0f423a; --bgw3: #1a4480; --bgw3b: #163a70;
  --bgw4: #40287a; --bgw4b: #37226a; --bgw5: #7a4418; --bgw5b: #6a3a14; --bgw6: #4d1a34; --bgw6b: #42162c;
  --panel: #27306e; --panel-lo: #1c2354;

.screen.w0 { --bg: var(--bgw0); --bg2: var(--bgw0b); }
.screen.w1 { --bg: var(--bgw1); --bg2: var(--bgw1b); }
.screen.w2 { --bg: var(--bgw2); --bg2: var(--bgw2b); }
.screen.w3 { --bg: var(--bgw3); --bg2: var(--bgw3b); }
.screen.w4 { --bg: var(--bgw4); --bg2: var(--bgw4b); }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { height: 100%; overscroll-behavior: none; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0; height: 100%; display: flex; align-items: center; justify-content: center;
  /* en el celular se respeta la muesca y la barra de gestos */
  padding: max(12px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(14px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  overscroll-behavior: none; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  background: var(--desk); color: var(--ink);
  font-family: var(--fb); font-size: 22px; line-height: 1.15;
}
button { font: inherit; color: inherit; }
b, strong, h3, .btn, .rbtn, .key, .chip, .fm, .stitle, .tot, .vbtn, .vchip, .wbadge { font-family: var(--fs); font-weight: 400; }
b, strong, .stitle { font-size: .93em; }
p { margin: 0; }
:focus-visible { outline: 3px solid var(--ext); outline-offset: 4px; }

/* ---------- consola: pantalla a la izquierda, mando a la derecha ---------- */
.gba {
  width: 100%; max-width: 1320px; height: 100%; max-height: 880px;
  display: grid; grid-template-columns: minmax(0, 1fr) 236px; gap: 4px;
  padding: 16px 6px 22px 18px; background: var(--shell);
  border-radius: 30px 30px 54px 30px;
  box-shadow: inset 0 5px 0 0 var(--shell-hi), inset 0 -9px 0 0 var(--shell-lo), inset -5px 0 0 0 var(--shell-lo), 0 12px 0 0 rgba(0, 0, 0, .4);
}
.bezel {
  position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column;
  padding: 26px 14px 14px; background: var(--bezel); border-radius: 14px 14px 26px 14px;
  box-shadow: 0 3px 0 0 var(--shell-hi);
}
.btop { position: absolute; top: 8px; left: 18px; right: 18px; display: flex; align-items: center; gap: 10px; color: var(--shell-ink); }
.led { width: 9px; height: 9px; border-radius: 50%; background: var(--pri); box-shadow: 0 0 6px 1px var(--pri); }
.brand { font-family: var(--fd); font-size: 9px; letter-spacing: .14em; }
.brand b { font-family: inherit; font-size: 1em; color: var(--hi); }
.screen {
  flex: 1; min-width: 0; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 12px; border-radius: 3px;
  position: relative;
  scrollbar-width: thin; scrollbar-color: var(--line) transparent;
  background-color: var(--bg);
  background-image: linear-gradient(45deg, var(--bg2) 25%, transparent 25%, transparent 75%, var(--bg2) 75%),
    linear-gradient(45deg, var(--bg2) 25%, transparent 25%, transparent 75%, var(--bg2) 75%);
  background-size: 24px 24px; background-position: 0 0, 12px 12px; background-attachment: local;
}
/* .fit envuelve cada pantalla: se encoge lo justo para caber en el alto disponible */
.fit { position: relative; display: flex; flex-direction: column; gap: 8px; transform-origin: 0 0; }
.fit > * { flex-shrink: 0; }

.pad { display: flex; flex-direction: column; align-items: center; justify-content: space-between; gap: 8px; padding: 0 8px 4px; color: var(--shell-ink); min-height: 0; }
.pad button { border: 0; padding: 0; cursor: pointer; background: var(--key); color: var(--key-ink); font-family: var(--fd); -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
.pad button:active, .pad button.pressed { transform: translateY(3px); box-shadow: none; }
.shoulders { display: flex; gap: 12px; }
.sh { width: 86px; height: 34px; border-radius: 12px 12px 6px 6px; font-size: 11px; box-shadow: 0 4px 0 0 var(--key-lo); }
.dpad { position: relative; width: 132px; height: 132px; flex: none; filter: drop-shadow(0 4px 0 var(--key-lo)); }
.dpad::before { content: ''; position: absolute; left: 44px; top: 44px; width: 44px; height: 44px; background: var(--key); }
.dpad::after { content: ''; position: absolute; left: 58px; top: 58px; width: 16px; height: 16px; border-radius: 50%; background: var(--key-lo); opacity: .55; }
.dpad button { position: absolute; width: 44px; height: 44px; }
.dpad .up { left: 44px; top: 0; border-radius: 9px 9px 0 0; }
.dpad .down { left: 44px; top: 88px; border-radius: 0 0 9px 9px; }
.dpad .left { left: 0; top: 44px; border-radius: 9px 0 0 9px; }
.dpad .right { left: 88px; top: 44px; border-radius: 0 9px 9px 0; }
.dpad button::after { content: ''; position: absolute; left: 50%; top: 50%; border: 7px solid transparent; }
.dpad .up::after { border-bottom-color: var(--key-ink); transform: translate(-50%, -80%); }
.dpad .down::after { border-top-color: var(--key-ink); transform: translate(-50%, -20%); }
.dpad .left::after { border-right-color: var(--key-ink); transform: translate(-80%, -50%); }
.dpad .right::after { border-left-color: var(--key-ink); transform: translate(-20%, -50%); }
.dpad button:active, .dpad button.pressed { transform: none; filter: brightness(.75); }
.ab { position: relative; width: 156px; height: 104px; flex: none; }
.rb { position: absolute; width: 62px; height: 62px; border-radius: 50%; font-size: 15px; box-shadow: 0 5px 0 0 var(--key-lo); }
.rb.a { right: 4px; top: 0; }
.rb.b { left: 4px; bottom: 0; }
.ss { display: flex; gap: 18px; font-family: var(--fd); font-size: 7px; letter-spacing: .08em; }
.ss span { display: flex; flex-direction: column; align-items: center; gap: 7px; }
.ss button { width: 54px; height: 16px; border-radius: 8px; box-shadow: 0 3px 0 0 var(--key-lo); }
.legend { min-height: 5.2em; font-size: 17px; line-height: 1.15; text-align: center; text-wrap: balance; }
.legend b { font-family: var(--fd); font-size: 8px; font-weight: 400; color: var(--hi); }
.speaker { width: 96px; height: 40px; flex: none; background-image: radial-gradient(circle, var(--shell-lo) 3px, transparent 3.5px); background-size: 16px 13px; background-position: 0 0; }
.padf { outline: 4px solid var(--hi) !important; outline-offset: 2px; position: relative; z-index: 2; animation: padf .6s steps(2) infinite; }
@keyframes padf { 50% { outline-color: var(--pri); } }

/* ---------- piezas ---------- */
.panel { background: var(--panel); margin: 4px; padding: 12px 14px; box-shadow: var(--ol), inset 0 -4px 0 0 var(--panel-lo); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .45em;
  border: 0; margin: 4px; padding: .5em .9em; background: var(--btn); color: var(--ink);
  line-height: 1.1; cursor: pointer;
  box-shadow: var(--ol), inset -3px -3px 0 0 var(--btn-lo);
}
.btn:active:not(:disabled) { transform: translateY(2px); box-shadow: var(--ol), inset 3px 3px 0 0 var(--btn-lo); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.pri { background: var(--pri); color: var(--pri-ink); --btn-lo: var(--pri-lo); }
.btn.sm { font-size: .85em; padding: .42em .7em; }

.fm { letter-spacing: .03em; white-space: nowrap; }
b, strong { word-spacing: .14em; }
.owl { display: block; flex: none; animation: bob 1.2s steps(2) infinite; }

.owl .bk { visibility: hidden; }
.owl.talk .bk { animation: bk .24s steps(1) infinite; }
.owl .spk { animation: blink .7s steps(1) infinite; }
.owl.m-happy { animation: hop .52s steps(2) infinite; }
.owl.m-think { animation: tilt 2.2s steps(2) infinite; }
.owl.m-brave { animation: bob .6s steps(2) infinite; }
.owl.m-sad { animation: bob 2s steps(2) infinite; }
.owl.m-sad.fresh { animation: shake .4s steps(4) 2, bob 2s steps(2) .8s infinite; }
@keyframes blk { 0%, 93% { visibility: hidden; } 94%, 100% { visibility: visible; } }
@keyframes bk { 0% { visibility: visible; } 50% { visibility: hidden; } }
@keyframes hop { 50% { transform: translateY(-6px); } }
@keyframes tilt { 50% { transform: rotate(-5deg); } }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.btn.snd.off .g { opacity: .45; }
.vb { display: inline-flex; align-items: flex-end; gap: 2px; height: 12px; }
.vb i { width: 3px; background: var(--panel-lo); box-shadow: 0 0 0 1px var(--ink2); }
.vb i:nth-child(1) { height: 4px; } .vb i:nth-child(2) { height: 6px; } .vb i:nth-child(3) { height: 8px; } .vb i:nth-child(4) { height: 10px; } .vb i:nth-child(5) { height: 12px; }
.vb i.on { background: var(--pri); box-shadow: 0 0 0 1px var(--line); }
.snddlg { width: min(420px, 100%); gap: 10px; }
.vol { display: flex; align-items: center; gap: 6px; }
.vol b { width: 4.6em; margin-left: 4px; }
.vol .btn { min-width: 2.4em; font-size: 1.1em; }
.vmeter { flex: 1; display: flex; justify-content: center; align-items: flex-end; gap: 6px; }
.vmeter i { width: 16px; background: var(--panel-lo); box-shadow: 0 0 0 3px var(--line); }
.vmeter i:nth-child(1) { height: 10px; } .vmeter i:nth-child(2) { height: 15px; } .vmeter i:nth-child(3) { height: 20px; } .vmeter i:nth-child(4) { height: 25px; } .vmeter i:nth-child(5) { height: 30px; }
.vmeter i.on { background: var(--hi); }
.title { position: relative; }
.tsnd { position: absolute; top: 0; right: 0; display: flex; }
.winowl { margin-bottom: -4px; }
@keyframes bob { 50% { transform: translateY(-3px); } }
@keyframes blink { 50% { opacity: .25; } }
.blink { animation: blink 1.1s steps(1) infinite; }
.stars { display: inline-flex; gap: 2px; font-size: 1.05em; }
.stars i { color: var(--panel-lo); }
.stars i.on { color: var(--star); }
.done { color: var(--ok); }

.hud { display: flex; align-items: center; gap: 8px; margin: 4px; padding: 4px 6px; background: var(--panel); box-shadow: var(--ol); }
.hud-t { flex: 1; min-width: 0; text-align: center; }
.hud h1 { margin: 0; font-family: var(--fd); font-size: 12px; line-height: 1.5; font-weight: 400; text-wrap: balance; }
.hud-s { display: block; font-size: .78em; color: var(--ink2); }
.hud-r { display: flex; align-items: center; gap: 4px; }
.tot { color: var(--star); white-space: nowrap; }

.dialog {
  display: flex; gap: 12px; align-items: flex-start; margin: 4px; padding: 12px 14px;
  background: var(--panel); box-shadow: var(--ol), inset 0 0 0 3px var(--wc);
}
.dialog .who { flex: none; display: flex; flex-direction: column; align-items: center; gap: 6px; font-family: var(--fd); font-size: 7px; color: var(--ink2); }
.dialog .say { flex: 1; min-width: 0; }
.dialog.err { box-shadow: var(--ol), inset 0 0 0 3px var(--bad); }
.dialog.hint { box-shadow: var(--ol), inset 0 0 0 3px var(--hi-lo); }
.dialog.ok { box-shadow: var(--ol), inset 0 0 0 3px var(--ok); }
.dialog.big { min-height: 5.4em; font-size: 1.06em; }
.dialog.small { font-size: .95em; min-height: 4.4em; padding: 9px 12px; }
.twh { visibility: hidden; }
.tww { white-space: nowrap; }

/* ---------- portada ---------- */
.title { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; text-align: center; padding-block: 16px; }
.logo { display: flex; flex-direction: column; align-items: center; gap: 12px; font-family: var(--fd); line-height: 1; }
.l1 {
  font-size: clamp(28px, 7.4vw, 60px); color: var(--logo);
  text-shadow: 4px 0 var(--line), -4px 0 var(--line), 0 4px var(--line), 0 -4px var(--line), 4px 4px var(--line), -4px -4px var(--line), 4px -4px var(--line), -4px 4px var(--line), 8px 8px 0 var(--line);
}
.l2 {
  font-size: clamp(14px, 3.8vw, 28px); letter-spacing: .32em; margin-right: -.32em; color: var(--hi);
  text-shadow: 3px 0 var(--line), -3px 0 var(--line), 0 3px var(--line), 0 -3px var(--line), 3px 3px var(--line), -3px -3px var(--line), 3px -3px var(--line), -3px 3px var(--line), 6px 6px 0 var(--line);
}
.tag { background: var(--panel); padding: 5px 12px; box-shadow: var(--ol); }
.hero { display: flex; align-items: center; justify-content: center; gap: 26px; flex-wrap: wrap; }
.hero-proof.sheet { font-size: 20px; background: var(--panel); box-shadow: var(--ol), inset 0 -4px 0 0 var(--panel-lo); padding: 10px 6px 12px; text-align: left; }
.strip { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.wbadge {
  display: inline-flex; align-items: center; justify-content: center; min-width: 2.5em; height: 2.5em; padding: 0 .35em; margin: 4px;
  background: var(--wc); color: var(--on-w); font-size: 1.1em;   box-shadow: var(--ol), inset -3px -3px 0 0 rgba(0, 0, 0, .22);
}

/* ---------- mapa ---------- */
.map { display: grid; grid-template-columns: repeat(auto-fit, minmax(244px, 1fr)); gap: 4px; }
.wcard {
  display: grid; grid-template-columns: auto 1fr; grid-template-areas: "b i" "p p"; gap: 10px 12px; align-items: center;
  text-align: left; border: 0; margin: 4px; padding: 12px 12px 14px; background: var(--panel); cursor: pointer;
  box-shadow: var(--ol), inset 0 -4px 0 0 var(--panel-lo);
}
.wcard .wbadge { grid-area: b; font-size: 1.2em; }
.winfo { grid-area: i; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.wnum { font-family: var(--fd); font-size: 8px; letter-spacing: .1em; color: var(--ink2); }
.winfo b { font-size: 1.12em; line-height: 1.15; }
.wlogic { font-size: .85em; color: var(--ink2); }
.wprog { grid-area: p; display: flex; align-items: center; gap: 10px; font-size: .85em; min-height: 1.4em; }
.pbar { flex: 1; height: 10px; background: var(--panel-lo); box-shadow: 0 0 0 2px var(--line); }
.pbar i { display: block; height: 100%; background: var(--wc); }
.cnt { white-space: nowrap; color: var(--ink2); }
.wcard.locked { cursor: not-allowed; }
.wcard.locked .wbadge { background: var(--panel-lo); color: var(--ink2); }
.wcard.locked .winfo { opacity: .55; }
.wcard:active:not(.locked) { transform: translateY(2px); }
.opts { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; }
.optnote { font-size: .82em; color: var(--ink2); margin-left: 6px; }

/* ---------- lista de etapas ---------- */
.stages { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 0 6px; }
.stages li { min-width: 0; display: flex; }
.srow {
  flex: 1; min-width: 0; display: grid; grid-template-columns: 1.3em 1.6em minmax(0, 1fr) auto; align-items: center; gap: 7px;
  text-align: left; border: 0; margin: 4px; padding: 4px 8px 7px 4px; background: var(--panel); cursor: pointer;
  box-shadow: var(--ol), inset 0 -3px 0 0 var(--panel-lo);
}
.snum { font-family: var(--fd); font-size: 9px; color: var(--ink2); text-align: right; }
.stype { display: flex; align-items: center; justify-content: center; width: 1.6em; height: 1.6em; background: var(--wc); color: var(--on-w); }
.srow.tT .stype { background: var(--panel-lo); color: var(--ink); }
.stype .g.op { margin: 0; }
.stitle { min-width: 0; line-height: 1.15; }
.stitle small { font-family: var(--fd); font-size: 7px; margin-left: 6px; color: var(--ink2); vertical-align: middle; }
.srow .stars { font-size: .82em; }
.boss { font-family: var(--fd); font-style: normal; font-size: 7px; background: var(--pri); color: var(--pri-ink); padding: 3px 5px; vertical-align: middle; }
.srow.locked { cursor: not-allowed; }
.srow.locked > * { opacity: .45; }
.srow:active:not(.locked) { transform: translateY(2px); }

/* ---------- teoría ---------- */
.theory { flex: 1; display: flex; flex-direction: column; gap: 8px; }
.scene { flex: 1; min-height: 150px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 18px 14px; overflow: hidden; }
.scene.empty { background: transparent; box-shadow: none; }
.scene .sheet { font-size: 24px; }

/* Lógica Advance — núcleo lógico: fórmulas, pruebas de Fitch y reglas */
(function (root) {
'use strict';

const VARS = 'xyzwuv';

const isVar = c => VARS.includes(c);

class LErr extends Error {}

    case 'atom': return f.p + f.args.join('');

    case 'box': return '□' + str(f.a, false);

      const args = [];
      while (s[i] && s[i] >= 'a' && s[i] <= 'z') args.push(s[i++]);
      return Atom(c, args);
    }
    fail(c ? 'No esperaba «' + c + '» ahí.' : 'La fórmula está incompleta.');
  }
  if (!s) fail('Escribe una fórmula.');
  const f = iff();
  if (i < s.length) fail('No esperaba «' + s[i] + '» ahí.');
  return f;
}

function subformulas(f, out) {
  out = out || [];
  out.push(f);
  if (f.a) subformulas(f.a, out);
  if (f.b) subformulas(f.b, out);
  return out;
}
function size(f) { return subformulas(f).length; }

function names(f, out) {
  out = out || new Set();
  if (f.t === 'atom') f.args.forEach(a => { if (!isVar(a)) out.add(a); });
  if (f.a) names(f.a, out);
  if (f.b) names(f.b, out);
  return out;
}
function varsOf(f, out) {
  out = out || new Set();
  if (f.t === 'atom') f.args.forEach(a => { if (isVar(a)) out.add(a); });
  if (f.v) out.add(f.v);
  if (f.a) varsOf(f.a, out);
  if (f.b) varsOf(f.b, out);
  return out;
}
function freeVars(f, bound, out) {
  bound = bound || new Set(); out = out || new Set();
  if (f.t === 'atom') f.args.forEach(a => { if (isVar(a) && !bound.has(a)) out.add(a); });
  else if (f.t === 'all' || f.t === 'ex') { const b2 = new Set(bound); b2.add(f.v); freeVars(f.a, b2, out); }
  else { if (f.a) freeVars(f.a, bound, out); if (f.b) freeVars(f.b, bound, out); }
  return out;
}
const closed = f => freeVars(f).size === 0;

function subst(f, v, t) {
  switch (f.t) {
    case 'atom': return Atom(f.p, f.args.map(a => (a === v ? t : a)));
    case 'bot': return f;
    case 'not': case 'box': case 'dia': return { t: f.t, a: subst(f.a, v, t) };
    case 'all': case 'ex': return f.v === v ? f : Qf(f.t, f.v, subst(f.a, v, t));
    default: return Bin(f.t, subst(f.a, v, t), subst(f.b, v, t));
  }
}
function countName(f, c) {
  let k = 0;
  subformulas(f).forEach(g => { if (g.t === 'atom') g.args.forEach(a => { if (a === c) k++; }); });
  return k;
}
/* cambia apariciones del nombre c por la variable v; mask elige cuáles (bit i = aparición i) */
function replName(f, c, v, mask) {
  let k = 0;
  const go = g => {
    switch (g.t) {
      case 'atom': return Atom(g.p, g.args.map(a => {
        if (a !== c) return a;
        const bit = 1 << k++;
        return mask & bit ? v : a;
      }));
      case 'bot': return g;
      case 'not': case 'box': case 'dia': return { t: g.t, a: go(g.a) };
      case 'all': case 'ex': return Qf(g.t, g.v, go(g.a));
      default: { const a = go(g.a); return Bin(g.t, a, go(g.b)); }
    }
  };
  return go(f);
}
/* ¿inst es instancia de Qx A? → nombre usado, null si la variable no aparece, false si no lo es */
function instName(q, inst) {
  if (!freeVars(q.a).has(q.v)) return eq(q.a, inst) ? null : false;
  for (const n of names(inst)) if (eq(subst(q.a, q.v, n), inst)) return n;
  return false;
}

/* ---------- semántica de valores (clásica y LP) ---------- */
function evalF(f, v) {
  switch (f.t) {
    case 'atom': return v[str(f)];
    case 'bot': return 0;
    case 'not': return 1 - evalF(f.a, v);
    case 'and': return Math.min(evalF(f.a, v), evalF(f.b, v));
    case 'or': return Math.max(evalF(f.a, v), evalF(f.b, v));
    case 'imp': return Math.max(1 - evalF(f.a, v), evalF(f.b, v));
    case 'iff': { const a = evalF(f.a, v), b = evalF(f.b, v); return Math.min(Math.max(1 - a, b), Math.max(1 - b, a)); }
  }
  fail('Fórmula no evaluable');
}
function atomsOf(fs) {
  const s = new Set();
  fs.forEach(f => subformulas(f).forEach(g => { if (g.t === 'atom') s.add(str(g)); }));
  return [...s].sort();
}

/* ---------- estado de la prueba ---------- */
function newProof(premises) {
  const st = { lines: [], subs: {}, open: [], nid: 1 };
  premises.forEach(f => st.lines.push({ f, kind: 'prem', rule: 'Premisa', cites: '', path: [] }));
  return st;
}
const clone = st => JSON.parse(JSON.stringify(st));

function openSub(st, kind, f) {
  st = clone(st);
  const id = st.nid++;
  st.subs[id] = { id, kind, start: st.lines.length, end: null, parent: st.open.slice() };
  st.open.push(id);
  st.lines.push({ f: f || null, kind, rule: kind === 'hyp' ? 'Supuesto' : '', cites: '', path: st.open.slice() });
  return st;
}
const addHyp = (st, f) => openSub(st, 'hyp', f);
const addStrict = st => openSub(st, 'strict', null);
function closeSub(st) {
  if (!st.open.length) fail('No hay ninguna subprueba abierta.');
  st = clone(st);
  const id = st.open.pop();
  st.subs[id].end = st.lines.length - 1;
  return st;
}

function isPrefix(p, S) {
  if (p.length > S.length) return false;
  for (let i = 0; i < p.length; i++) if (p[i] !== S[i]) return false;
  return true;
}
function strictBetween(st, p, S) {
  let k = 0;
  for (let j = p.length; j < S.length; j++) if (st.subs[S[j]].kind === 'strict') k++;
  return k;
}
/* nº de fronteras estrictas entre la línea i y la posición S; -1 si no es accesible */
function lineK(st, i, S) {
  const ln = st.lines[i];
  if (ln.kind === 'strict' || !isPrefix(ln.path, S)) return -1;
  return strictBetween(st, ln.path, S);
}
function subK(st, sp, S) {
  if (sp.end == null || !isPrefix(sp.parent, S)) return -1;
  return strictBetween(st, sp.parent, S);
}
function subAt(st, lineNo) {
  for (const id in st.subs) if (st.subs[id].start === lineNo - 1) return st.subs[id];
  return null;
}
/* subprueba cerrada (la más externa) que contiene la línea i y que se puede citar desde aquí */
function pickSub(st, i) {
  for (const id of st.lines[i].path) {
    const sp = st.subs[id];
    if (sp.end != null) return subK(st, sp, st.open) === 0 ? sp : null;
  }
  return null;
}
function subInfo(st, sp) {
  const endIdx = sp.end == null ? st.lines.length - 1 : sp.end;
  const first = st.lines[sp.start], last = st.lines[endIdx];
  const direct = last.path.length === sp.parent.length + 1;
  return {
    sp, kind: sp.kind, open: sp.end == null,
    hyp: sp.kind === 'hyp' ? first.f : null,
    last: direct && last.f ? last.f : null,
    ref: (sp.start + 1) + '–' + (endIdx + 1)
  };
}
function openHyps(st, base) {
  const out = st.lines.filter(l => l.kind === 'prem').map(l => l.f);
  base.forEach(id => { const sp = st.subs[id]; if (sp.kind === 'hyp') out.push(st.lines[sp.start].f); });
  return out;
}
function namesInPlay(st, goal) {
  const s = new Set();
  st.lines.forEach(l => { if (l.f) names(l.f, s); });
  if (goal) names(goal, s);
  return [...s].sort();
}
function freshName(st, goal) {
  const used = namesInPlay(st, goal);
  return [...NAMES].find(n => !used.includes(n)) || 'a';
}
function relSet(st, goal) {
  const s = new Set();
  const add = f => subformulas(f).forEach(g => s.add(str(g)));
  if (goal) add(goal);
  st.lines.forEach(l => { if (l.f && l.kind !== 'step') add(l.f); });
  return s;
}

/* ---------- reglas ---------- */
const one = (c, msg) => {
  if (c.L.length !== 1) fail(msg || 'Selecciona exactamente una línea.');
  return c.L[0];
};
const two = (c, msg) => { if (c.L.length !== 2) fail(msg); return c.L; };
function hypSub(c, i) {
  const s = c.subs[i || 0];
  if (s.kind !== 'hyp') fail('Esa subprueba es estricta (empieza con □): se cierra con □I.');
  if (!s.last) fail('La subprueba debe terminar en una línea propia, no en otra subprueba.');
  return s;
}
const NOSUB = 'Esta regla necesita una subprueba. Ábrela con «Suponer», trabaja dentro y pulsa la regla cuando llegues a lo que buscas.';

const RULES = {
  'R': {
    name: 'Reiteración', desc: 'Repite una línea disponible.', use: 'Selecciona 1 línea.',
    fn: c => { const l = one(c, 'Selecciona la línea que quieres repetir.'); return [{ f: l.f, cites: '' + l.n }]; }
  },
  '∧I': {
    name: 'Introducción de la conjunción', desc: 'De A y de B, concluye A∧B.', use: 'Selecciona 2 líneas.',
    fn: c => {
      if (c.L.length < 1 || c.L.length > 2) fail('Selecciona las dos líneas que quieres unir con ∧.');
      const a = c.L[0], b = c.L[1] || a;
      return [{ f: And(a.f, b.f), cites: a.n + ', ' + b.n }, { f: And(b.f, a.f), cites: b.n + ', ' + a.n }];
    }
  },

    name: 'Eliminación de la conjunción', desc: 'De A∧B, concluye A (o B).', use: 'Selecciona 1 línea con una conjunción.',

      const l = one(c, 'Selecciona una línea con una conjunción A∧B.');
      if (l.f.t !== 'and') fail('La línea ' + l.n + ' no es una conjunción: su conectiva principal no es ∧.');
      return [{ f: l.f.a, cites: '' + l.n }, { f: l.f.b, cites: '' + l.n }];
    }
  },

    fn: c => {
      const l = one(c, 'Selecciona la línea que será uno de los lados de la disyunción.');
      if (!c.P) return { need: '¿Qué fórmula pones al otro lado de ∨?', kind: 'or' };
      return [{ f: Or(l.f, c.P), cites: '' + l.n }, { f: Or(c.P, l.f), cites: '' + l.n }];

    name: 'Eliminación de la disyunción', desc: 'De A∨B, una subprueba de A a C y otra de B a C, concluye C.',
    use: 'Haz una subprueba por caso y pulsa la regla.', subs: 2,
    noSub: 'Para ∨E necesitas dos subpruebas: una que suponga el primer lado de la disyunción y otra que suponga el segundo, y las dos deben llegar a la misma fórmula.',
    fn: c => {
      if (c.L.length > 1) fail('Selecciona solo la línea con la disyunción; las dos subpruebas se detectan solas.');
      if (c.L.length === 1 && c.L[0].f.t !== 'or') fail('La línea ' + c.L[0].n + ' no es una disyunción A∨B.');
      const ds = c.L.length ? c.L : c.avail().filter(l => l.f.t === 'or');
      if (!ds.length) fail('No hay ninguna disyunción A∨B disponible para razonar por casos.');
      const out = [];
      for (const d of ds) for (const s1 of c.subs) for (const s2 of c.subs) {
        if (s1 === s2 || s1.kind !== 'hyp' || s2.kind !== 'hyp' || !s1.last || !s2.last) continue;
        if (c.close && !s1.open && !s2.open) continue;
        if (eq(s1.hyp, d.f.a) && eq(s2.hyp, d.f.b) && eq(s1.last, s2.last))
          out.push({ f: s1.last, cites: d.n + ', ' + s1.ref + ', ' + s2.ref });
      }
      if (!out.length) fail(RULES['∨E'].noSub);
      return out;
    }
  },
  '→I': { noLines: true,
    name: 'Introducción del condicional', desc: 'De una subprueba que supone A y llega a B, concluye A→B.',
    use: 'Pulsa la regla dentro de la subprueba.', subs: 1,
    fn: c => { const s = hypSub(c); return [{ f: Imp(s.hyp, s.last), cites: s.ref }]; }
  },
  '→E': {
    name: 'Eliminación del condicional (modus ponens)', desc: 'De A→B y A, concluye B.', use: 'Selecciona 2 líneas.',
    fn: c => {
      const [x, y] = two(c, 'Selecciona dos líneas: un condicional A→B y su antecedente A.');
      const out = [];
      for (const [p, q] of [[x, y], [y, x]])
        if (p.f.t === 'imp' && eq(p.f.a, q.f)) out.push({ f: p.f.b, cites: p.n + ', ' + q.n });
      if (!out.length) {
        if (x.f.t !== 'imp' && y.f.t !== 'imp') fail('Ninguna de las dos líneas es un condicional A→B.');
        fail('La otra línea tiene que ser exactamente el antecedente del condicional.');
      }
      return out;
    }
  },
  '¬I': { noLines: true,
    name: 'Introducción de la negación (reducción al absurdo)', desc: 'De una subprueba que supone A y llega a ⊥, concluye ¬A.',
    use: 'Pulsa la regla cuando la subprueba llegue a ⊥.', subs: 1,
    fn: c => {
      const s = hypSub(c);
      if (s.last.t !== 'bot') fail('Para ¬I la subprueba debe terminar en ⊥. Busca una fórmula y su negación y aplica ¬E.');
      return [{ f: Not(s.hyp), cites: s.ref }];
    }
  },
  '¬E': {
    name: 'Eliminación de la negación', desc: 'De A y ¬A, concluye ⊥.', use: 'Selecciona 2 líneas.',
    fn: c => {
      const [x, y] = two(c, 'Selecciona dos líneas: una fórmula A y su negación ¬A.');
      for (const [p, q] of [[x, y], [y, x]])
        if (q.f.t === 'not' && eq(q.f.a, p.f)) return [{ f: Bot, cites: p.n + ', ' + q.n }];

  },
  '⊥E': {

    fn: c => {

      if (l.f.t !== 'bot') fail('La línea ' + l.n + ' no es ⊥.');

      return [{ f: c.P, cites: '' + l.n }];
    }
  },
  '¬¬E': {
    name: 'Eliminación de la doble negación', desc: 'De ¬¬A, concluye A.', use: 'Selecciona 1 línea.',
    fn: c => {
      const l = one(c, 'Selecciona una línea de la forma ¬¬A.');
      if (l.f.t !== 'not' || l.f.a.t !== 'not') fail('La línea ' + l.n + ' no empieza por dos negaciones.');
      return [{ f: l.f.a.a, cites: '' + l.n }];
    }
  },
  '↔I': { noLines: true,
    name: 'Introducción del bicondicional', desc: 'De una subprueba de A a B y otra de B a A, concluye A↔B.',
    use: 'Haz las dos subpruebas y pulsa la regla.', subs: 2,
    noSub: 'Para ↔I necesitas dos subpruebas: una que suponga A y llegue a B, y otra que suponga B y llegue a A.',
    fn: c => {
      const out = [];
      for (const s1 of c.subs) for (const s2 of c.subs) {
        if (s1 === s2 || s1.kind !== 'hyp' || s2.kind !== 'hyp' || !s1.last || !s2.last) continue;
        if (c.close && !s1.open && !s2.open) continue;
        if (eq(s1.hyp, s2.last) && eq(s2.hyp, s1.last)) out.push({ f: Iff(s1.hyp, s2.hyp), cites: s1.ref + ', ' + s2.ref });
      }
      if (!out.length) fail(RULES['↔I'].noSub);
      return out;
    }
  },
  '↔E': {
    name: 'Eliminación del bicondicional', desc: 'De A↔B y uno de sus lados, concluye el otro.', use: 'Selecciona 2 líneas.',
    fn: c => {
      const [x, y] = two(c, 'Selecciona dos líneas: un bicondicional A↔B y uno de sus lados.');
      const out = [];
      for (const [p, q] of [[x, y], [y, x]]) if (p.f.t === 'iff') {
        if (eq(p.f.a, q.f)) out.push({ f: p.f.b, cites: p.n + ', ' + q.n });
        if (eq(p.f.b, q.f)) out.push({ f: p.f.a, cites: p.n + ', ' + q.n });

  '∀I': {
    name: 'Introducción del universal', desc: 'De A(c), concluye ∀xA(x), si c no aparece en premisas ni en supuestos abiertos.', use: 'Selecciona 1 línea.',
    fn: c => {
      const l = one(c, 'Selecciona la línea que quieres generalizar.');
      const ns = [...names(l.f)];
      if (!ns.length) fail('La línea ' + l.n + ' no menciona ningún nombre sobre el que generalizar.');

      const ok = ns.filter(n => !blocked.has(n));
      if (!ok.length) fail('No puedes generalizar sobre «' + ns.join(', ') + '»: aparece en una premisa o en un supuesto abierto, así que no es un individuo arbitrario.');
      const used = varsOf(l.f), out = [];
      for (const v of [...VARS].filter(x => !used.has(x)).slice(0, 3))

      return out;
    }
  },
  '∀E': {
    name: 'Eliminación del universal', desc: 'De ∀xA(x), concluye A(c) para el nombre c que quieras.', use: 'Selecciona 1 línea y elige el nombre.',
    fn: c => {
      const l = one(c, 'Selecciona una línea que empiece por ∀.');
      if (l.f.t !== 'all') fail('La línea ' + l.n + ' no es un universal: su símbolo principal no es ∀.');
      const ts = namesInPlay(c.st, c.goal);

        for (const n of ns) {
          const k = countName(l.f, n), full = (1 << k) - 1;
          const masks = [full];
          if (k <= 3) for (let m = full - 1; m >= 1; m--) masks.push(m);
          masks.forEach(m => out.push({ f: Qf('ex', v, replName(l.f, n, v, m)), cites: '' + l.n }));
        }
      return out;
    }
  },
  '∃E': {
    name: 'Eliminación del existencial', desc: 'De ∃xA(x) y una subprueba que supone A(c), con c nuevo, y llega a B sin c, concluye B.',
    use: 'Supón la instancia con un nombre nuevo y pulsa la regla al final.', subs: 1,
    fn: c => {
      const s = hypSub(c);
      if (c.L.length > 1) fail('Selecciona solo la línea con el existencial.');
      if (c.L.length === 1 && c.L[0].f.t !== 'ex') fail('La línea ' + c.L[0].n + ' no es un existencial: su símbolo principal no es ∃.');

  '□E': {

/* Aplica una regla. sel: nº de línea (>0) o -nº de la primera línea de una subprueba cerrada.
   Devuelve {ok, st} | {error} | {need:'formula', prompt, kind, A} | {need:'choice', options}. */
function apply(st, rid, sel, extra, goal) {
  extra = extra || {};
  const rule = RULES[rid];
  const selL = rule.noLines ? [] : sel.filter(x => x > 0);
  const selS = sel.filter(x => x < 0).map(x => subAt(st, -x)).filter(Boolean);
  const nS = rule.subs || 0;
  const attempts = [];
  if (!nS) attempts.push({ base: st.open, close: false, pool: [] });
  else {
    const closedAcc = base => Object.values(st.subs)
      .filter(sp => sp.end != null && subK(st, sp, base) === 0).sort((a, b) => b.start - a.start);
    if (selS.length >= nS) attempts.push({ base: st.open, close: false, pool: selS });
    else {
      if (st.open.length) {
        const base = st.open.slice(0, -1);
        const openSp = st.subs[st.open[st.open.length - 1]];
        attempts.push({ base, close: true, pool: [openSp, ...selS, ...(nS > 1 && !selS.length ? closedAcc(base) : [])] });
      }
      const ca = closedAcc(st.open);
      const rest = nS === 1 ? ca.filter(sp => sp.end === st.lines.length - 1) : ca;
      attempts.push({ base: st.open, close: false, pool: selS.length ? [...selS, ...(nS > 1 ? ca.filter(s => !selS.includes(s)) : [])] : rest });
    }
  }
  const rel = relSet(st, goal);
  let firstErr = null;
  for (const at of attempts) {
    try {
      const L = selL.map(n => {
        const k = lineK(st, n - 1, at.base);
        if (k < 0) fail('La línea ' + n + ' no se puede citar desde ahí: queda dentro de la subprueba que se cierra.');
        return { n, f: st.lines[n - 1].f, k };
      });
      const cross = rule.cross || 0;
      for (const l of L) {
        if (l.k === cross) continue;
        if (!cross) fail('La línea ' + l.n + ' está fuera de la subprueba estricta: pertenece a otro mundo. Solo puede entrar con □E (o con R4 y R5 si el sistema las tiene).');
        if (l.k === 0) fail(rid + ' sirve para traer una fórmula desde fuera de una subprueba estricta. La línea ' + l.n + ' ya está en el mismo mundo.');
        fail('La línea ' + l.n + ' está a más de una subprueba estricta de distancia.');
      }
      at.pool.forEach(sp => { if (sp.end != null && subK(st, sp, at.base) !== 0) fail('Esa subprueba no se puede citar desde aquí.'); });
      if (at.pool.length < nS) fail(rule.noSub || NOSUB);
      const ctx = {
        st, goal, L, close: at.close, P: extra.f || null,
        subs: at.pool.map(sp => subInfo(st, sp)),
        hyps: openHyps(st, at.base),
        avail: () => st.lines.map((l, i) => ({ n: i + 1, f: l.f, k: lineK(st, i, at.base) })).filter(l => l.k === 0)
      };
      const res = rule.fn(ctx);
      if (res.need) return { need: 'formula', prompt: res.need, kind: res.kind, A: L[0] ? L[0].f : null };
      const seen = new Set();
      let cands = res.filter(c => { const k = str(c.f); if (seen.has(k)) return false; seen.add(k); return true; });
      cands.sort((a, b) => (rel.has(str(b.f)) ? 1 : 0) - (rel.has(str(a.f)) ? 1 : 0));
      let pick = null;
      if (extra.out != null) {
        pick = cands.find(c => str(c.f) === extra.out);
        if (!pick) fail('Ese resultado no se obtiene con ' + rid + '.');
      } else if (cands.length === 1) pick = cands[0];
      else return { need: 'choice', options: cands.slice(0, 12).map(c => c.f) };
      const ns = clone(st);
      if (at.close) { const id = ns.open.pop(); ns.subs[id].end = ns.lines.length - 1; }
      ns.lines.push({ f: pick.f, kind: 'step', rule: rid, cites: pick.cites, path: ns.open.slice() });
      return { ok: true, st: ns };
    } catch (e) {
      if (!(e instanceof LErr)) throw e;
      firstErr = firstErr || e.message;
    }
  }
  return { error: firstErr };
}

/* paso de una solución: ['H', f] supuesto · ['S'] estricta · ['C'] cerrar · [regla, sel, salida, fórmula] */
function step(st, s, goal) {
  const op = s[0];
  if (op === 'H') return addHyp(st, parse(s[1]));
  if (op === 'S') return addStrict(st);
  if (op === 'C') return closeSub(st);
  const r = apply(st, op, s[1] || [], { out: s[2], f: s[3] ? parse(s[3]) : null }, goal);
  if (r.ok) return r.st;
  fail(r.error || 'Paso ambiguo (' + op + '): falta ' + r.need);
}

/* sugerencias para los cuadros de fórmula */
function suggest(kind, st, goal, A) {
  const out = [], seen = new Set();
  const push = f => { const k = str(f); if (closed(f) && !seen.has(k)) { seen.add(k); out.push(f); } };
  const acc = st.lines.filter((l, i) => lineK(st, i, st.open) === 0).map(l => l.f);
  const all = [];
  if (goal) subformulas(goal, all);
  st.lines.forEach(l => { if (l.f) subformulas(l.f, all); });
  const bySize = all.slice().sort((a, b) => size(a) - size(b));
  if (kind === 'hyp') {
    const fr = freshName(st, goal);
    acc.forEach(f => { if (f.t === 'ex') push(subst(f.a, f.v, fr)); });
    acc.forEach(f => { if (f.t === 'or') { push(f.a); push(f.b); } });
    all.forEach(g => { if (g.t === 'imp') push(g.a); });
    all.forEach(g => { if (g.t === 'not') push(g.a); });
    if (goal && goal.t !== 'bot') push(Not(goal));
    all.forEach(g => { if (g.t === 'iff') { push(g.a); push(g.b); } });
    bySize.forEach(g => { if (g.t !== 'bot') push(g); });
    return out.slice(0, 10);
  }
  if (kind === 'or') {
    all.forEach(g => { if (g.t === 'or') { if (eq(g.a, A)) push(g.b); if (eq(g.b, A)) push(g.a); } });
    bySize.forEach(g => { if (g.t !== 'bot') push(g); });
    return out.slice(0, 8);
  }
  if (kind === 'bot' && goal) push(goal);
  bySize.forEach(g => { if (g.t !== 'bot') push(g); });
  return out.slice(0, 8);
}

function enterStage() {

/* ----- teoría ----- */
function staticRow(r) {

function figHTML(f) {
  if (Array.isArray(f)) return `<div class="figrow">${f.map(figHTML).join('')}</div>`;
  if (f.k === 'fitch') return `<div class="sheet static">${f.rows.map(staticRow).join('')}</div>`;
  if (f.k === 'table') return `<div class="tw"><table class="tbl"><thead><tr>${f.head.map(h => `<th>${tx(h)}</th>`).join('')}</tr></thead><tbody>${f.rows.map(r => `<tr>${r.map(c => `<td>${tx(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  if (f.k === 'kripke') {
    const BW = 104, BH = 46, pos = {};
    f.w.forEach(w => { pos[w.id] = w; });
    const arrows = f.e.map(([a, b]) => {
      const A = pos[a], B = pos[b];

    }).join('');

      f.w.map(w => `<div class="world" style="left:${w.x}px;top:${w.y}px"><b>${w.id}</b><span>${tx('{' + (w.t || '–') + '}')}</span></div>`).join('')}</div>
      <p class="cap">${tx(f.cap)}</p></div>`;
  }
  return '';
}

/* Minerva escribe letra a letra, con su voz de pitidos, y mueve el pico mientras habla */
function typewriter(el) {
  const box = el.closest('.dialog');
  const bird = box && box.querySelector('.owl');
  if (bird) bird.classList.add('fresh');
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const units = [];
  const walk = node => {
    [...node.childNodes].forEach(ch => {
      if (ch.nodeType === 3) {
        const frag = document.createDocumentFragment();
        ch.textContent.split(/(\s+)/).forEach(tok => {
          if (!tok) return;
          if (/^\s+$/.test(tok)) { frag.appendChild(document.createTextNode(tok)); return; }
          const word = document.createElement('span');
          word.className = 'tww';
          for (const c of tok) { const sp = document.createElement('span'); sp.className = 'twh'; sp.textContent = c; word.appendChild(sp); units.push(sp); }
          frag.appendChild(word);
        });
        ch.replaceWith(frag);
      } else if (ch.nodeName.toLowerCase() === 'svg') { ch.classList.add('twh'); units.push(ch); }
      else walk(ch);
    });
  };
  walk(el);
  if (bird) bird.classList.add('talk');
  let i = 0, n = 0;
  twTimer = setInterval(() => {
    for (let k = 0; k < 2 && i < units.length; k++) units[i++].classList.remove('twh');
    if (n++ % 2 === 0) AU.blip();
    if (i >= units.length) { clearInterval(twTimer); if (bird) bird.classList.remove('talk'); }
  }, 30);
}
function twDone() {
  const hidden = app.querySelectorAll('.twh');
  if (!hidden.length) return true;
  clearInterval(twTimer);
  hidden.forEach(e => e.classList.remove('twh'));
  app.querySelectorAll('.owl.talk').forEach(o => o.classList.remove('talk'));
  return false;
}

/* ----- prueba de Fitch ----- */
function rowHTML(o) {
  let bars = '';
  for (let d = 0; d <= o.depth; d++) {
    const last = d === o.depth;
    bars += `<i class="bar${last && o.top ? ' top' : ''}${last && o.foot ? ' foot' : ''}"></i>`;
  }
  return `<div class="row ${o.cls || ''}" ${o.attr || ''}><span class="ln">${o.n}</span><span class="bars">${bars}</span><span class="fml${o.foot ? ' foot' : ''}">${o.html}</span><span class="just">${o.just || ''}</span></div>`;
}
function sheetHTML() {
  const st = ST.st, S = st.open;
  const selL = new Set(ST.sel.filter(x => x > 0));
  const selS = ST.sel.filter(x => x < 0).map(x => L.subAt(st, -x));
  let lastPrem = -1;
  st.lines.forEach((l, i) => { if (l.kind === 'prem') lastPrem = i; });
  let h = '';
  st.lines.forEach((ln, i) => {
    const k = L.lineK(st, i, S), cls = [];
    const marker = ln.kind === 'strict';
    const openMarker = marker && st.subs[ln.path[ln.path.length - 1]].end == null;
    if (selL.has(i + 1) || selS.some(sp => i >= sp.start && i <= sp.end)) cls.push('sel');
    if (k < 0 && !openMarker) cls.push(L.pickSub(st, i) ? 'insub' : 'dim');
    else if (k === 1) cls.push('ext');
    else if (k > 1) cls.push('dim');
    if (openMarker) cls.push('mark');
    if (i === ST.flash) cls.push('new');
    const sub = ln.kind === 'hyp' || marker;
    h += rowHTML({
      n: i + 1, depth: ln.path.length, html: marker ? fm('□') : fh(ln.f),
      just: raw(ln.rule) + (ln.cites ? ' ' + ln.cites : ''), top: sub, foot: sub || i === lastPrem,
      cls: cls.join(' '), attr: `data-act="line" data-i="${i}" role="button" tabindex="0"`
    });
  });
  if (!ST.solved) h += rowHTML({ n: '', depth: S.length, html: '<span class="caret"></span>', cls: 'cursor' });
  return h;
}
function paletteHTML() {
  const st = ST.st, off = ST.solved || ST.playing ? 'disabled' : '';

const SYSNAME = { K: 'Sistema K', T: 'Sistema T', S4: 'Sistema S4', S5: 'Sistema S5', LP: 'Lógica LP' };

const IDLE = 'Toca las líneas que quieres usar y pulsa una regla.';

function commit(st) {
  ST.hist.push(ST.st);

function checkWin() {
  const last = ST.st.lines[ST.st.lines.length - 1];

  ST.solved = true;
  const stars = ST.usedSol ? 1 : ST.hints ? 2 : 3;
  finish(stars);
  say('ok', '¡Demostrado! La conclusión está en la columna principal.');
  const mine = ST;
  setTimeout(() => { if (ST === mine && V.scr === 'stage') winModal(stars, `${ST.st.lines.length} líneas` + (ST.usedSol ? ' · con la solución' : ST.hints ? ` · ${ST.hints} ${ST.hints === 1 ? 'pista' : 'pistas'}` : ' · sin pistas')); }, 650);
}

function doRule(rid, extra) {
  const r = L.apply(ST.st, rid, ST.sel, extra, ST.goal);
  if (r.error) { sfx.err(); say('err', raw(r.error)); closeModal(); render(); return; }
  if (r.need === 'formula') {
    openFormula(r.prompt, L.suggest(r.kind, ST.st, ST.goal, r.A), f => doRule(rid, Object.assign({}, extra, { f })));
    return;
  }
  if (r.need === 'choice') {
    openChoice(`${raw(rid)}: elige el resultado`, r.options, f => doRule(rid, Object.assign({}, extra, { out: L.str(f) })));
    return;

}
function playSolution() {
  const mine = ST, sol = ST.stage.sol;
  ST.usedSol = true; ST.playing = true; ST.st = ST.init; ST.hist = []; ST.sel = []; ST.flash = null;
  say('hint', 'Mira cómo se construye, paso a paso.');

    ST.st = L.step(ST.st, sol[i++], ST.goal);

/* ----- modelos ----- */
const VNAME = { 1: 'V', 0.5: 'A', 0: 'F' };
function scrModel() {
  const s = ST.stage, lp = s.logic === 'LP';
  const des = v => (lp ? v >= 0.5 : v === 1);
  const vals = lp ? [1, 0.5, 0] : [1, 0];
  const sat = s.mode === 'sat';   // consistencia: hay que hacerlas todas verdaderas
  const rowsF = sat ? ST.prem.map(f => ['Proposición', f, true]) : [...ST.prem.map(f => ['Premisa', f, true]), ['Conclusión', ST.goal, false]];
  let all = true;

    if (!good) all = false;
    return `<tr><td class="lab">${lab}</td><td>${fh(f)}</td><td><span class="vchip v${v * 2}">${VNAME[v]}</span></td>

  }).join('');
  ST.all = all;
  return `<div class="proof">
    ${sat ? `<div class="goal panel"><span class="gtag">CONSISTENCIA</span><span class="seq">${ST.prem.map(fh).join('<span class="comma">,</span> ')}</span><span class="sys">Lógica clásica</span></div>` : goalHTML('CONTRAEJEMPLO', ST.prem, ST.goal, '⊬', lp ? 'Lógica LP' : 'Lógica clásica')}

/* ----- tablas de verdad ----- */
function ttRows(atoms) {
  const n = atoms.length, rows = [];
  for (let i = 0; i < (1 << n); i++) {
    const v = {};
    atoms.forEach((a, j) => { v[a] = (i >> (n - 1 - j)) & 1 ? 0 : 1; });
    rows.push(v);
  }
  return rows;
}
function scrTable() {

    const x = ST.cells[c][r], mk = ST.mark ? ST.mark[c][r] : '';
    return `<td class="fc"><button class="tcell${x == null ? ' empty' : ''}${mk ? ' ' + mk : ''}" data-act="tcell" data-c="${c}" data-r="${r}" aria-label="${esc(L.str(f))}, fila ${r + 1}: ${x == null ? 'vacía' : VNAME[x]}" ${ST.solved || mk === 'good' ? 'disabled' : ''}>${x == null ? '?' : VNAME[x]}</button></td>`;
  }).join('')}</tr>`).join('');
  const filled = ST.cells.every(col => col.every(x => x != null));
  return `<div class="proof">
    <div class="goal panel"><span class="gtag">TABLA DE VERDAD</span><span class="seq">${ST.cols.map(fh).join('<span class="comma">,</span> ')}</span><span class="sys">${ST.rows.length} filas</span></div>
    <div class="cols">
      <div class="panel model"><div class="tw"><table class="tbl tt"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div></div>
      <div class="side">${sayBox(ST.msg, true)}
        <div class="panel pal"><div class="acts">
          <button class="btn pri" data-act="tcheck" ${filled && !ST.solved ? '' : 'disabled'}>Comprobar</button>

/* ---------- ventanas ---------- */
function closeModal() {
  if (!modal.hidden) padKey = padKeyApp;
  modal.hidden = true; modal.innerHTML = ''; FD = null;

}
function showModal(html, cls) { modal.innerHTML = `<div class="mbox panel ${cls || ''}" role="dialog" aria-modal="true">${html}</div>`; if (modal.hidden) padKeyApp = padKey; modal.hidden = false; if (padOn) padSet(padDefault()); legend(); }

function alphabet() {
  const fs = [ST.goal, ...ST.st.lines.filter(l => l.f).map(l => l.f)];
  const preds = new Set(), sy = new Set();
  let fo = false;
  fs.forEach(f => L.subformulas(f).forEach(g => { if (g.t === 'atom') { preds.add(g.p); if (g.args.length) fo = true; } }));
  const txt = ST.rules.join('') + fs.map(L.str).join('');
  for (const c of '¬∧∨→↔⊥∀∃□◇') if (txt.includes(c)) sy.add(c);
  if (ST.rules.some(r => ['DN', 'DeM', 'LEM'].includes(r))) ['¬', '∧', '∨'].forEach(c => sy.add(c));
  if (ST.rules.some(r => ['RT', 'R4', 'R5', 'MC'].includes(r))) ['¬', '□', '◇'].forEach(c => sy.add(c));
  let terms = [];
  if (fo) {
    terms = L.namesInPlay(ST.st, ST.goal);
    const fr = L.freshName(ST.st, ST.goal);
    if (!terms.includes(fr)) terms.push(fr);
    if (sy.has('∀') || sy.has('∃')) terms.push('x', 'y');
  }
  return { preds: [...preds].sort(), terms, syms: [...'¬∧∨→↔⊥∀∃□◇'].filter(c => sy.has(c)), fo };
}
function openFormula(title, sug, onOK) {
  const al = alphabet();
  FD = { buf: '', onOK, sug, al };
  const key = (k, lab, cls) => `<button class="key ${cls || ''}" data-act="fkey" data-k="${esc(k)}">${lab || raw(k)}</button>`;
  showModal(`<h3>${tx(title)}</h3>
    ${sug.length ? `<div class="mlabel">SUGERENCIAS</div><div class="chips">${sug.map((f, i) => `<button class="chip" data-act="fsug" data-i="${i}">${fh(f)}</button>`).join('')}</div>` : ''}
    <div class="mlabel">O ESCRIBE OTRA</div>
    <div class="fdisp" id="fdisp"></div>
    <div class="fstat" id="fstat"></div>
    <div class="keys">
      <div class="krow">${al.preds.map(p => key(p)).join('')}${al.terms.map(t => key(t, null, 'term')).join('')}</div>
      <div class="krow">${al.syms.map(c => key(c)).join('')}${key('(')}${key(')')}${key('bs', ico('back') + ' Borrar', 'wide')}</div>
    </div>
    <div class="mrow"><button class="btn" data-act="mcancel">Cancelar</button><button class="btn pri" data-act="fok">Aceptar</button></div>
    <p class="cap kbd">Con teclado: ${al.syms.map(c => `<span><kbd>${esc(KEYOF[c])}</kbd>${glyph(c)}</span>`).join("")}<span><kbd>Intro</kbd>aceptar</span></p>`, 'fdlg');
  fdRefresh();
}
function fdCheck() {
  try {
    const f = L.parse(FD.buf);
    if (!L.closed(f)) throw new L.LErr('Hay una variable suelta. Usa un nombre (a, b, c) o un cuantificador.');
    return { f };
  } catch (e) { if (e instanceof L.LErr) return { err: e.message }; throw e; }
}
function fdRefresh() {
  const d = document.getElementById('fdisp'), s = document.getElementById('fstat');
  if (!d) return;
  d.innerHTML = `<span class="fm">${raw(FD.buf)}</span><span class="caret"></span>`;
  if (!FD.buf) { s.className = 'fstat'; s.textContent = ''; return; }
  const r = fdCheck();
  s.className = 'fstat ' + (r.f ? 'good' : 'no');
  s.innerHTML = r.f ? ico('check') + ' Fórmula bien formada' : esc(r.err);
}
function fdKey(k) {
  if (k === 'bs') FD.buf = [...FD.buf].slice(0, -1).join('');
  else if ([...FD.buf].length < 40) FD.buf += k;
  sfx.sel();
  fdRefresh();
}
function fdOK() {
  const r = fdCheck();
  if (r.err) { sfx.err(); fdRefresh(); return; }
  const cb = FD.onOK;
  cb(r.f);
}
function openChoice(title, opts, onPick) {
  FD = { opts, onPick, choice: true };
  showModal(`<h3>${title}</h3><div class="choices">${opts.map((f, i) => `<button class="btn chopt" data-act="cpick" data-i="${i}">${fh(f)}</button>`).join('')}</div>
    <div class="mrow"><button class="btn" data-act="mcancel">Cancelar</button></div>`);
}
const meter = v => [1, 2, 3, 4, 5].map(i => `<i class="${i <= v ? 'on' : ''}"></i>`).join('');
function openSound() {
  const row = (lab, k) => `<div class="vol"><b>${lab}</b>
    <button class="btn sm" data-act="vol" data-k="${k}" data-d="-1" aria-label="Bajar ${lab.toLowerCase()}" ${save[k] <= 0 ? 'disabled' : ''}>-</button>
    <span class="vmeter" role="img" aria-label="${lab}: ${save[k]} de 5">${meter(save[k])}</span>
    <button class="btn sm" data-act="vol" data-k="${k}" data-d="1" aria-label="Subir ${lab.toLowerCase()}" ${save[k] >= 5 ? 'disabled' : ''}>+</button></div>`;
  showModal(`<h3>Volumen</h3>${row('Música', 'mv')}${row('Efectos', 'sv')}
    <div class="mrow"><button class="btn pri" data-act="mcancel">Listo</button></div>`, 'snddlg');
}
function openBook() {
  showModal(`<h3>Libro de reglas</h3><div class="book">${ST.rules.map(r => { const R = L.RULES[r]; return `<div class="brow"><span class="rbtn static">${raw(r)}</span><div><b>${R.name}</b><p>${raw(R.desc)}</p><small>${R.use}</small></div></div>`; }).join('')}</div>
    <div class="mrow"><button class="btn pri" data-act="mcancel">Cerrar</button></div>`, 'bookdlg');
}
function winModal(stars, detail) {
  const W = C.worlds[V.w], last = V.s === W.stages.length - 1;
  const outro = ST.stage.outro ? `<p class="outro">${tx(ST.stage.outro)}</p>` : '';
  showModal(`<div class="winowl">${owl(4, 'happy')}</div><div class="qed">${ST.type === 'P' ? 'Q.E.D.' : '¡BIEN!'}</div>
    <div class="bigstars">${starsHTML(stars)}</div>
    <p class="detail">${detail}</p>${outro}
    <div class="mrow"><button class="btn" data-act="again">Repetir</button><button class="btn" data-act="toWorld">Etapas</button>
    <button class="btn pri" data-act="next"><span>${last ? 'Al mapa' : 'Siguiente'}</span>${ico('next')}</button></div>`, 'win');
}
function nextStage() {
  const W = C.worlds[V.w];
  if (V.s < W.stages.length - 1) go('stage', V.w, V.s + 1); else go('map');
}

/* ---------- acciones ---------- */
const ACT = {
  start() { sfx.ok(); go('map'); },
  title() { go('title'); },
  map() { go('map'); },
  toWorld() { go('world'); },
  sound() { openSound(); },
  vol(d) {
    save[d.k] = Math.max(0, Math.min(5, save[d.k] + (+d.d)));
    persist(); applySound(); sfx.sel();
    render(); openSound();
  },
  free() { save.free = !save.free; persist(); sfx.sel(); render(); },
  theme() { save.theme = { '': 'light', light: 'dark', dark: '' }[save.theme]; persist(); applyTheme(); sfx.sel(); render(); },
  wipe() {
    showModal(`<h3>¿Borrar todo el progreso?</h3><p>Se perderán las etapas completadas y las estrellas.</p>
      <div class="mrow"><button class="btn pri" data-act="mcancel">No, volver</button><button class="btn" data-act="wipeYes">Sí, borrar</button></div>`);
  },
  wipeYes() { save.done = {}; persist(); closeModal(); render(); },
  world(d) {
    if (!worldOpen(+d.w)) { sfx.err(); return; }
    sfx.sel(); go('world', +d.w);
  },
  stage(d) {
    if (!stageOpen(V.w, +d.s)) { sfx.err(); return; }
    sfx.sel(); go('stage', V.w, +d.s);
  },
  again() { go('stage'); },
  next() { nextStage(); },

  twskip() { twDone(); },
  tprev() { if (ST.page) { ST.page--; sfx.page(); render(); } },
  tnext() {
    if (!twDone()) return;
    if (ST.page < ST.stage.pages.length - 1) { ST.page++; sfx.page(); render(); return; }
    save.done[sid(V.w, V.s)] = 1; persist(); sfx.ok();
    nextStage();
  },

  line(d) {
    if (ST.type !== 'P' || ST.solved || ST.playing) return;
    const i = +d.i, st = ST.st, ln = st.lines[i], k = L.lineK(st, i, st.open);
    let ref = null;
    if (k >= 0) ref = i + 1;
    else { const sp = L.pickSub(st, i); if (sp) ref = -(sp.start + 1); }
    if (ref == null) {
      if (ln.kind === 'strict') return;
      sfx.err(); say('err', 'Esa línea está dentro de una subprueba cerrada que ya no se puede citar desde aquí.'); render(); return;
    }
    const at = ST.sel.indexOf(ref);
    if (at >= 0) ST.sel.splice(at, 1); else ST.sel.push(ref);
    ST.flash = null;
    sfx.sel(); render();
  },
  rule(d) { ST.flash = null; doRule(d.r, {}); },
  hyp() { openFormula('¿Qué quieres suponer?', L.suggest('hyp', ST.st, ST.goal), f => { closeModal(); commit(L.addHyp(ST.st, f)); }); },
  strict() { commit(L.addStrict(ST.st)); },
  close() { commit(L.closeSub(ST.st)); },
  undo() { if (!ST.hist.length) return; ST.st = ST.hist.pop(); ST.sel = []; ST.flash = null; say('info', IDLE); sfx.page(); render(); },
  reset() { ST.st = ST.init; ST.hist = []; ST.sel = []; ST.flash = null; say('info', tx(ST.stage.intro || IDLE)); sfx.page(); render(); },
  hint() {
    const hs = ST.stage.hints;
    if (ST.hints < hs.length) { ST.hints++; say('hint', `<b>Pista ${ST.hints} de ${hs.length}.</b> ` + tx(hs[ST.hints - 1])); }
    else say('hint', 'Ya te di todas las pistas. Si quieres, te enseño la prueba completa. <button class="btn sm" data-act="solve">Ver solución</button>');
    sfx.page(); render();
  },
  solve() { playSolution(); },
  book() { openBook(); },

  fkey(d) { fdKey(d.k); },
  fsug(d) { const cb = FD.onOK; cb(FD.sug[+d.i]); },
  fok() { fdOK(); },
  cpick(d) { const cb = FD.onPick; cb(FD.opts[+d.i]); },
  mcancel() { closeModal(); },

  tcell(d) {
    const c = +d.c, r = +d.r;
    ST.cells[c][r] = ST.cells[c][r] === 1 ? 0 : 1;
    if (ST.mark) ST.mark[c][r] = '';
    sfx.sel(); render();
  },
  tclear() { ST.cells = ST.cols.map(() => ST.rows.map(() => null)); ST.mark = null; say('info', tx(ST.stage.intro)); sfx.page(); render(); },
  tcheck() {
    ST.checks++;
    let bad = 0;
    ST.mark = ST.cols.map((f, c) => ST.rows.map((v, r) => { const ok = L.evalF(f, v) === ST.cells[c][r]; if (!ok) bad++; return ok ? 'good' : 'bad'; }));
    if (bad) {
      sfx.err();
      say('err', `Hay ${bad} ${bad === 1 ? 'casilla que no cuadra' : 'casillas que no cuadran'}, en rojo. Revisa el conector principal de esa columna.`);
      render(); return;
    }
    ST.solved = true;
    const stars = ST.checks === 1 ? 3 : ST.checks === 2 ? 2 : 1;
    finish(stars);
    say('ok', '¡Tabla correcta!');
    render();
    const mine = ST;
    setTimeout(() => { if (ST === mine && V.scr === 'stage') winModal(stars, mine.checks === 1 ? 'Correcta a la primera' : mine.checks + ' comprobaciones'); }, 600);
  },
  val(d) {
    ST.val[d.a] = +d.v; ST.moves++;
    sfx.sel(); render();
    if (ST.all && !ST.solved) {
      ST.solved = true;
      const stars = ST.moves <= ST.atoms.length + 1 ? 3 : 2;
      finish(stars);
      const mine = ST;
      setTimeout(() => { if (ST === mine) winModal(stars, mine.stage.mode === 'sat' ? 'Todas verdaderas a la vez: el conjunto es consistente.' : 'Premisas designadas, conclusión no: el argumento no es válido.'); }, 500);
    }
  },
  qpick(d) {
    const q = ST.stage.qs[ST.i], i = +d.i;
    if (i === q.ok) { ST.picked = i; sfx.ok(); } else { ST.bad.push(i); ST.wrong++; sfx.err(); }
    render();
  },
  qnext() {
    if (ST.i < ST.stage.qs.length - 1) { ST.i++; ST.picked = -1; ST.bad = []; sfx.page(); render(); return; }
    const stars = ST.wrong === 0 ? 3 : ST.wrong <= 2 ? 2 : 1;
    finish(stars);
    winModal(stars, ST.wrong ? `${ST.wrong} ${ST.wrong === 1 ? 'fallo' : 'fallos'}` : 'Sin fallos');
  }
};
/* ---------- mando: cruceta, A, B, L, R, START y SELECT ---------- */
let padOn = false;      // el cursor del mando solo se muestra cuando se está usando
let padKey = null, padKeyApp = null, padClick = false;
const keyOf = e => Object.keys(e.dataset).sort().map(k => k + '=' + e.dataset[k]).join('&');
function padCands() {
  const rootEl = modal.hidden ? app : modal;
  return [...rootEl.querySelectorAll('button:not(:disabled), .row[data-act]')].filter(e => e.offsetParent !== null && !e.classList.contains('locked') && !e.classList.contains('cursor'));
}
function padCur() { return padOn && padKey ? padCands().find(e => keyOf(e) === padKey) || null : null; }
function padShow() {
  document.querySelectorAll('.padf').forEach(e => e.classList.remove('padf'));
  const e = padCur();
  if (e) { e.classList.add('padf'); e.scrollIntoView({ block: 'nearest' }); }
  return e;
}
function padDefault() {
  const c = padCands();
  return c.find(e => e.classList.contains('pri')) || c.find(e => !e.closest('.hud') && !e.closest('.tsnd')) || c[0] || null;
}
function padSet(e) { padOn = true; padKey = e ? keyOf(e) : null; padShow(); }
function padMove(dir) {
  const cur = padCur();
  if (!cur) { padSet(padDefault()); return; }
  const r0 = cur.getBoundingClientRect(), x0 = r0.left + r0.width / 2, y0 = r0.top + r0.height / 2;
  let best = null, bs = Infinity;
  padCands().forEach(e => {
    if (e === cur) return;
    const r = e.getBoundingClientRect(), dx = r.left + r.width / 2 - x0, dy = r.top + r.height / 2 - y0;
    const horiz = dir === 'left' || dir === 'right';
    const along = dir === 'left' ? -dx : dir === 'right' ? dx : dir === 'up' ? -dy : dy;
    if (along < 6) return;
    /* si los dos elementos se solapan en el eje perpendicular, casi no se penaliza el desvío */
    const overlap = horiz ? Math.min(r0.bottom, r.bottom) - Math.max(r0.top, r.top) : Math.min(r0.right, r.right) - Math.max(r0.left, r.left);
    const across = Math.abs(horiz ? dy : dx);
    const score = along + across * (overlap > 4 ? 0.4 : 2.6);
    if (score < bs) { bs = score; best = e; }
  });
  if (best) { padSet(best); sfx.sel(); }
}
function padPress(k) {
  AU.unlock();
  const inModal = !modal.hidden, T = V.scr === 'stage' && ST ? ST.type : '';
  if (k === 'up' || k === 'down' || k === 'left' || k === 'right') {
    if (!inModal && T === 'T' && (k === 'left' || k === 'right')) { ACT[k === 'left' ? 'tprev' : 'tnext'](); return; }
    padMove(k); return;
  }
  if (k === 'A') {
    if (!inModal && app.querySelector('.twh')) { twDone(); return; }
    const cur = padCur();
    if (cur) { padClick = true; try { cur.click(); } finally { padClick = false; } return; }
    if (!inModal && V.scr === 'title') { ACT.start(); return; }
    if (!inModal && T === 'T') { ACT.tnext(); return; }
    padSet(padDefault()); return;
  }
  if (k === 'B') {
    if (inModal) { if (modal.querySelector('.win')) ACT.toWorld(); else closeModal(); sfx.page(); return; }
    const back = app.querySelector('.hud [data-act]');
    if (back) { sfx.page(); back.click(); }
    return;
  }
  if (k === 'start') {
    if (inModal) { if (modal.querySelector('.snddlg')) closeModal(); return; }
    if (V.scr === 'title') ACT.start(); else openSound();
    return;
  }
  if (inModal) return;
  if (V.scr === 'map' || V.scr === 'world') {
    if (k === 'L' || k === 'R') {
      const w = V.w + (k === 'L' ? -1 : 1);
      if (V.scr === 'world' && w >= 0 && w < C.worlds.length && worldOpen(w)) { sfx.sel(); go('world', w); }
    }
    return;
  }
  if (T === 'T') { if (k === 'L') ACT.tprev(); if (k === 'R') ACT.tnext(); return; }
  if (T === 'P' && !ST.solved && !ST.playing) {
    if (k === 'L') ACT.undo();
    if (k === 'R') ACT.hint();
    if (k === 'select') openBook();
    return;
  }
  if (T === 'TT' && !ST.solved) {
    if (k === 'R' && ST.cells.every(col => col.every(x => x != null))) ACT.tcheck();
    if (k === 'select') ACT.tclear();
    return;
  }
  if (T === 'Q' && k === 'R') { const n = app.querySelector('[data-act=qnext]'); if (n) n.click(); }
}
/* qué hace cada botón en la pantalla actual */
function legend() {
  const el = document.getElementById('legend');
  if (!el) return;
  const T = V.scr === 'stage' && ST ? ST.type : '';
  let items;
  if (!modal.hidden) items = [['A', 'elegir'], ['B', modal.querySelector('.win') ? 'etapas' : 'cerrar']];
  else if (V.scr === 'title') items = [['A', 'jugar'], ['START', 'jugar']];
  else if (V.scr === 'map') items = [['A', 'entrar'], ['B', 'portada'], ['START', 'volumen']];
  else if (V.scr === 'world') items = [['A', 'entrar'], ['B', 'mapa'], ['L R', 'otro mundo']];
  else if (T === 'T') items = [['A', 'seguir'], ['B', 'salir'], ['L R', 'página']];
  else if (T === 'P') items = [['A', 'elegir'], ['B', 'salir'], ['L', 'deshacer'], ['R', 'pista'], ['SELECT', 'reglas']];
  else if (T === 'TT') items = [['A', 'V / F'], ['B', 'salir'], ['R', 'comprobar'], ['SELECT', 'borrar']];
  else if (T === 'Q') items = [['A', 'elegir'], ['B', 'salir'], ['R', 'siguiente']];
  else items = [['A', 'elegir'], ['B', 'salir'], ['START', 'volumen']];
  el.innerHTML = items.map(([k, t]) => `<b>${k}</b> ${t}`).join(' · ');
}
document.querySelector('.pad').addEventListener('click', e => {
  const b = e.target.closest('[data-pad]');
  if (b) { padPress(b.dataset.pad); b.blur(); }
});

['pointerdown', 'pointerup', 'touchend', 'click', 'keydown'].forEach(ev => document.addEventListener(ev, () => AU.unlock(), true));
document.addEventListener('click', e => {
  if (e.target.closest('.pad')) return;
  if (!padClick && e.isTrusted && padOn) { padOn = false; padShow(); }
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) { if (e.target === modal && !modal.querySelector('.win')) closeModal(); return; }
  const fn = ACT[b.dataset.act];
  if (fn) fn(b.dataset, b);
});
const KEYOF = { '¬': '~', '∧': '&', '∨': '|', '→': '>', '↔': '=', '⊥': '#', '∀': '@', '∃': '?', '□': '[', '◇': '<' };
const KEYMAP = { '~': '¬', '!': '¬', '&': '∧', '^': '∧', '|': '∨', '>': '→', '=': '↔', '#': '⊥', '@': '∀', '?': '∃', '[': '□', '<': '◇', '(': '(', ')': ')' };
document.addEventListener('keydown', e => {
  if (e.ctrlKey && e.key.toLowerCase() === 'z' && V.scr === 'stage' && ST.type === 'P' && modal.hidden) { e.preventDefault(); ACT.undo(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const DIR = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right' }[e.key];
  if (DIR) { e.preventDefault(); padPress(DIR); return; }
  if (!modal.hidden && FD && !FD.choice) {   // se está escribiendo una fórmula: las letras van a la fórmula
    if (e.key === 'Escape') { closeModal(); return; }
    const al = FD.al;
    if (e.key === 'Enter') { e.preventDefault(); const cur = padCur(); if (cur) padPress('A'); else fdOK(); return; }
    if (e.key === 'Backspace') { e.preventDefault(); fdKey('bs'); return; }
    let k = KEYMAP[e.key];
    if (k && k !== '(' && k !== ')' && !al.syms.includes(k)) k = null;
    if (!k && /^[a-zA-Z]$/.test(e.key)) {
      if (al.preds.includes(e.key)) k = e.key;
      else if (al.terms.includes(e.key)) k = e.key;
      else if (al.preds.includes(e.key.toUpperCase()) && !al.fo) k = e.key.toUpperCase();
    }
    if (k) { e.preventDefault(); fdKey(k); }
    return;
  }
  /* un botón enfocado con el tabulador se activa de la forma habitual */
  const onCtl = e.target.matches && e.target.matches('button, .row[data-act]');
  if ((e.key === 'Enter' || e.key === ' ') && onCtl) {
    if (e.target.matches('.row[data-act]')) { e.preventDefault(); e.target.click(); }
    return;
  }
  const PADKEY = { z: 'A', x: 'B', a: 'L', s: 'R', enter: 'start', backspace: 'select', escape: 'B' }[e.key.toLowerCase()];
  if (PADKEY) { e.preventDefault(); padPress(PADKEY); }
});

/* icono de pestaña */
try {
  const link = document.createElement('link');
  link.rel = 'icon';
  link.href = 'data:image/svg+xml,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" shape-rendering="crispEdges">${owlBody('neutral')}</svg>`);
  document.head.appendChild(link);
} catch (e) { /* sin icono */ }

window.LogicaAdvance = { go, render, state: () => ST, owl };
render();
})();

</script>
